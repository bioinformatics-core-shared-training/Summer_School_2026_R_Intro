          <a href="https://www.uci.or.ug/"><img src="assets/imgs/logos/uci.png" alt="Uganda Cancer Institute"></a>
          <a href="https://www.mak.ac.ug/"><img class="p-tall" src="assets/imgs/logos/makerere.png" alt="Makerere University"></a>
        </div>
        <p class="eyebrow partners-split">Funded by</p>
        <div class="partners p-sm">
          <a href="https://www.cambridge-africa.cam.ac.uk/"><img src="assets/imgs/logos/cambridge-africa.svg" alt="Cambridge-Africa"></a>
          <img src="assets/imgs/logos/alborada.jpg" alt="The Alborada Trust">
          <a href="https://www.cancerresearchuk.org/"><img src="assets/imgs/logos/cruk.png" alt="Cancer Research UK"></a>
        </div>
      </div>
    </div>
    <footer class="site-footer">
      <div class="shell">
        <div class="footer-grid">
          <div>
            <h2>Introduction to R<br>for Biologists</h2>
            <p>Cancer Biology Summer School 2026<br>Monday 14 &ndash; Friday 18 September 2026<br>Uganda Cancer Institute, Kampala</p>
          </div>
          <div>
            <h3>Sessions</h3>
            <ul>
              <li><a href="session1.html">1 &middot; Data types and structures</a></li>
              <li><a href="session2.html">2 &middot; Other data structures</a></li>
              <li><a href="session3.html">3 &middot; Working with data</a></li>
              <li><a href="session4.html">4 &middot; Visualizing data</a></li>
              <li><a href="session5.html">5 &middot; Data manipulation</a></li>
              <li><a href="session6.html">6 &middot; Grouping and combining</a></li>
              <li><a href="session7.html">7 &middot; Restructuring data</a></li>
