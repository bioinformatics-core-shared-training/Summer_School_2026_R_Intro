# Quarto project configuration, replacing the former _site.yml.
#
# Everything the site needs is here: the eight session pages plus the landing
# page render into docs/, which is committed and served by GitHub Pages.
#
# Two things are deliberately excluded from the website render:
#   * session8_exercise.qmd - the students' target output. It is a standalone,
#     self-contained report and must NOT pick up the site navbar, so
#     render_site.R renders it separately and `resources` copies the result in.
#   * anything beginning with "_" - Quarto ignores those by convention, which
#     is what keeps _Brief_Recap.qmd unpublished and _includes/ out of docs/.
#
# data/ needs no exclusion either: Quarto copies only rendered pages, discovered
# resources and the `resources` list below, so the .csv/.tsv/.rds files the
# pages read at render time never reach docs/. Students get them from
# Bioinformatics_Workshop.zip.

project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!session8_exercise.qmd"
  resources:
    - .nojekyll
    - Bioinformatics_Workshop.zip
    # Both halves of the session 8 exercise: the rendered report that
    # session8.qmd links to, and its source, which students are invited to
    # download and compare against their own attempt.
    - session8_exercise.html
    - session8_exercise.qmd
    # Linked from _includes/footer.html on every page.
    - LICENSE

website:
  title: "R for Biologists"
  # Raw HTML passes through into <span class="navbar-title">, so the two-line
  # brand lockup carried over from _site.yml unchanged.
  # The site footer. It lives here rather than in _includes/footer.html because
  # of where Quarto puts each one. include-after-body lands INSIDE
  # #quarto-content, which is the page-columns grid and also the containing
  # block for the TOC rail - and the rail is position:sticky, so it stayed
  # pinned across the footer at the foot of a long page and painted over it.
  # page-footer is emitted as <footer class="footer"> directly under <body>,
  # outside that container, so the grid ends with the content and the rail
  # scrolls up out of the way as the footer arrives. No JS involved.
  #
  # Quarto wraps this in its own left/centre/right triptych; site.scss
  # neutralises those three cells so the bands still run full-bleed.
  page-footer: |
    ```{=html}
    <div class="footer-logos">
      <div class="shell">
