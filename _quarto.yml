format:
  html:
    theme: assets/css/site.scss
    # Plain CSS, not part of the theme: see the header of fonts.css for why
    # the @font-face rules cannot live in site.scss.
    css: assets/css/fonts.css
    highlight-style: assets/brand.theme
    toc: true
    toc-location: left
    toc-title: "On this page"
    toc-depth: 3
    # toc-location: left puts the TOC in #quarto-sidebar, so its width is
    # sidebar-width (not margin-width, which stays empty). 275 + 900 + gutters
    # reproduces the old 1200px shell.
    grid:
      sidebar-width: 275px
      body-width: 900px
      margin-width: 0px
      gutter-width: 2.5rem
    include-in-header: _includes/head.html
    # These three all match the previous rmarkdown output, which had none of
    # them. title-prefix is set empty because `website: title` otherwise
    # appends " - R for Biologists" to every <title>, and the landing page's
    # title already names the course.
    anchor-sections: false
    code-copy: false
    title-prefix: ""
    # Pinned to reproduce rmarkdown html_document's figure device exactly.
    # The committed baseline figures are 1344x960 = 7in x 96dpi x2, i.e.
    # fig.retina = 2, so this must be `retina` and not `png` - plain png would
    # halve every figure to 672x480 and rewrite all 94 committed PNGs.
    fig-format: retina
    fig-dpi: 96
    fig-width: 7
    fig-height: 5

# CRITICAL. Quarto's knitr shim sets opts_chunk$comment = NA
# (/opt/quarto/share/rmd/execute.R:322), whereas knitr and every previous build
# of this site used "##". Without this block the "## " prefix disappears from
# every console-output block on all eight session pages.
knitr:
  opts_chunk:
    comment: "##"
    # Pin the console width. Without this, output that adapts to the terminal
    # (anything via the cli package - the tidyverse startup banner, readr's
    # column specifications) is rendered at whatever width the tty of whoever
    # ran the build happened to be: the previously published pages were built
    # at 88 columns, a bare `quarto render` in a pipe gives 80. Pinning both
    # keeps docs/ reproducible and stops spurious diffs. cli.width is needed
    # as well as width because cli probes the terminal before falling back to
    # getOption("width").
    R.options:
      width: 80
      cli.width: 80

execute:
  # Stated explicitly: every render re-executes all code, as
  # rmarkdown::render_site() did. Switching to `freeze: auto` would also mean
  # committing _freeze/, and would decouple figure regeneration from renders.
  freeze: false
